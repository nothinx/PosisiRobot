sentence=Library odometri berbahasa Indonesia: posisi x, y dan arah robot dua roda dari encoder.
paragraph=Non-blocking, cukup kirim hitungan encoder ke perbarui(). Integrasi busur eksak, aman saat counter meluap, arah 0-360 derajat searah jarum jam (sama dengan ArahMPU6050), plus jarakKe(), arahKe(), dan selisihArahKe() untuk bergerak ke titik tujuan. Arah bisa dikoreksi dari IMU. Contoh odometri dengan interrupt, ke titik tujuan, dan kalibrasi roda. English: odometry, dead reckoning, differential drive, wheel encoder, robot position, go to point.
